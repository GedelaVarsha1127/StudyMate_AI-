<!DOCTYPE html>
<html>
<head>
    <title>StudyMate AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="chat-container">

        <h1>StudyMate AI</h1>
        <p class="subtitle">Your Educational AI Assistant</p>

        <div id="chat-box">
            <div class="bot-message">
                Hello! 👋 I am StudyMate AI. Ask me any question about
                Programming, AI, ML, Data Science or Computer Science.
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="user-input"
                placeholder="Ask your question..."
            >

            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
